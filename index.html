<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta charset="utf-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta content="#ffffff" name="theme-color" />
  <title>跨越长城</title>
  <meta name="description" content="跨越长城是一个综合性的网络代理隧道服务商，向客户提供高速稳定的服务" />
  <meta name="copyright" content="Crosswall Network Technology Co.,Ltd." />
  <meta name="repository" content="https://跨越长城.com" />
  <meta name="robots" content="index,follow" />

  <!-- 微信、QQ、百度浏览器拦截 -->
  <script>
    var ua = navigator.userAgent;
    var isBlocked = /MicroMessenger/i.test(ua)   // 微信
                 || /MQQBrowser/i.test(ua)        // QQ 浏览器
                 || /baiduboxapp/i.test(ua);      // 百度浏览器

    if (isBlocked) {
      // 阻止 Crisp 加载
      window.$crisp = [];
      window.CRISP_WEBSITE_ID = "";

      document.addEventListener('DOMContentLoaded', function () {
        var style = document.createElement('style');
        style.innerHTML = `
          * { margin: 0; padding: 0; box-sizing: border-box; }
          body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: #ffffff;
            color: #111111;
          }
          .wechat-block {
            text-align: center;
            padding: 48px 36px;
            max-width: 320px;
            width: 100%;
            border-radius: 4px;
          }
          .wechat-block .icon {
            font-size: 52px;
            margin-bottom: 20px;
          }
          .wechat-block h2 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
          }
          .wechat-block .divider {
            width: 28px;
            height: 2px;
            background: currentColor;
            opacity: 0.2;
            margin: 14px auto;
            border-radius: 4px;
          }
          .wechat-block p {
            font-size: 14px;
            line-height: 2;
            opacity: 0.5;
          }
          @media (prefers-color-scheme: dark) {
            body {
              background: #0d0d0d;
              color: #f0f0f0;
            }
          }
        `;
        document.head.appendChild(style);

        document.body.innerHTML = `
          <div class="wechat-block">
            <div class="icon">📵</div>
            <h2>暂不支持此浏览器打开</h2>
            <div class="divider"></div>
            <p>请使用 Safari 或 Chrome<br>等外部浏览器访问</p>
          </div>
        `;
      });
    } else {
      // 非受限浏览器正常加载 Crisp
      window.$crisp = [];
      window.CRISP_WEBSITE_ID = "0d31a6be-2276-432f-bd47-ac8d962e84ae";
      (function () {
        var d = document;
        var s = d.createElement("script");
        s.src = "https://client.crisp.chat/l.js";
        s.async = 1;
        d.getElementsByTagName("head")[0].appendChild(s);
      })();
    }
  </script>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <script src="/src/index.tsx" type="module"></script>
  <script>
    window.global = window;
  </script>
</body>
</html>
